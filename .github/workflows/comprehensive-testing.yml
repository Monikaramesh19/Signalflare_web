name: Complete Test Suite 4 Stages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium-web-tests:
    name: Selenium Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./e2e-web-tests
        run: npm install
      - name: Run Web E2E Tests
        working-directory: ./e2e-web-tests
        run: npm test || true

  appium-mobile-tests:
    name: Appium Mobile E2E
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./e2e-mobile-tests
        run: npm install
      - name: Run Appium Tests
        working-directory: ./e2e-mobile-tests
        run: npm test || true

  load-testing:
    name: Load and Performance Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Autocannon
        run: npm install -g autocannon
      - name: Run Baseline Load Test
        run: autocannon -c 100 -d 60 https://signalflare-web.onrender.com/api/health || true

  security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
